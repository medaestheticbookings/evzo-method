<body>
<style>
/* standalone reset (the artifact host used to supply this) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button{font:inherit}

/* Tabbed one-screen app (Focus / World / Pet / Stats / Extras) with full-bleed dark overlays for the funeral, the session, the unlock gate and the debrief. Monsters are drawn in code, not imported. */
:root{
  --bg:#EDF1F4;--surface:#FFFFFF;--line:#D3DBE2;--ink:#141D26;--muted:#5C6B7A;
  --accent:#0E7C86;--accent-soft:#D6EAEC;--slip:#B4522F;--gold:#B8862B;
  --panel:#0C1116;--panel-2:#121920;--panel-line:#243039;--panel-ink:#DCE6EC;--panel-muted:#6B7C8A;
  --teal:#3FB8C4;--flame:#D9774F;--on-accent:#FFFFFF;
  --font-display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --font-body:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1419;--surface:#18212A;--line:#2A3540;--ink:#E4EDF3;--muted:#8B9BA8;
  --accent:#3FB8C4;--accent-soft:#1B3338;--slip:#D9774F;--gold:#D9AE57;--on-accent:#05171A;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1419;--surface:#18212A;--line:#2A3540;--ink:#E4EDF3;--muted:#8B9BA8;
  --accent:#3FB8C4;--accent-soft:#1B3338;--slip:#D9774F;--gold:#D9AE57;--on-accent:#05171A;color-scheme:dark}
:root[data-skin="sunset"]{--accent:#C2553B;--accent-soft:#F6E0D8}
:root[data-skin="sunset"][data-theme="dark"],:root[data-skin="sunset"] {--teal:#E08A6B}
:root[data-skin="forest"]{--accent:#2F6B47;--accent-soft:#D8EADF;--teal:#6FC08C}
:root[data-skin="violet"]{--accent:#5B4BA8;--accent-soft:#E2DEF5;--teal:#9A8BE8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{min-height:100%;display:flex;flex-direction:column;padding-bottom:82px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:11px}
.mark-wrap{display:flex;align-items:center;gap:9px;min-width:0}
.mark-wrap h1{font-family:var(--font-display);font-size:22px;font-weight:400;margin:0;line-height:1;white-space:nowrap}
.logo{width:26px;height:26px;flex:none;display:block}
.logo .shackle{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.logo .body{fill:var(--accent-soft);stroke:var(--accent);stroke-width:5}
.logo .bar{fill:var(--accent)}
.hbtns{display:flex;align-items:center;gap:6px;flex:none}
.lvl{font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;padding:5px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.iconbtn{font-family:var(--font-body);font-size:11px;font-weight:500;letter-spacing:.06em;padding:6px 9px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;line-height:1}
main{padding-block:16px 8px;display:flex;flex-direction:column;gap:16px}
section{display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0}
p{margin:0}
.lede,.small{color:var(--muted);font-size:13px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);display:block;margin-bottom:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:11px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{font-family:var(--font-mono);font-size:14px;padding:12px 2px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;text-align:center;line-height:1.1}
.chip small{display:block;font-family:var(--font-body);font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip[aria-pressed="true"] small{color:var(--accent)}
input,textarea,select{width:100%;font-family:var(--font-body);font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
input:focus-visible,textarea:focus-visible,select:focus-visible{outline:none;border-color:var(--accent)}
.btn{font-family:var(--font-body);font-size:16px;font-weight:500;width:100%;padding:15px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{font-size:13px;padding:10px}
.btn:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:7px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.stat{background:var(--surface);padding:11px 9px;min-width:0}
.stat b{display:block;font-family:var(--font-mono);font-size:19px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.list{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.list li{display:flex;align-items:center;gap:9px;padding:9px 0;border-top:1px solid var(--line);font-size:13px;min-width:0}
.list li:first-child{border-top:none}
.list .k{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);flex:none}
.list .v{flex:1;min-width:0;overflow-wrap:anywhere}
.list .m{flex:none;font-size:11px;letter-spacing:.04em;text-transform:uppercase}
.m.ok{color:var(--accent)}.m.bad{color:var(--slip)}
.tile{border:1px solid var(--line);border-radius:12px;padding:9px 6px;background:var(--surface);text-align:center;min-width:0}
.tile svg{width:100%;height:auto;max-width:62px;display:block;margin:0 auto}
.tile .nm{font-size:11px;margin-top:5px;overflow-wrap:anywhere}
.tile .rr{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.tile .em{font-size:24px;line-height:1.2}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.locked{opacity:.3}
.heat{display:grid;grid-template-columns:repeat(15,1fr);gap:4px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:var(--line)}
.hours{display:flex;align-items:flex-end;gap:3px;height:58px}
.hours i{flex:1;background:var(--accent-soft);border-radius:2px 2px 0 0;min-height:2px}
.hours i.on{background:var(--accent)}
.banner{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:10px 12px;font-size:13px;text-wrap:balance}
.banner.warn{border-color:var(--slip);background:transparent;color:var(--slip)}
.pill{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;padding:4px 9px;border-radius:999px;border:1px solid currentColor}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;padding:9px 4px;border:none;background:transparent;color:var(--muted);font-family:var(--font-body);font-size:12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.days button{padding:8px 0;border-radius:9px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:11px;cursor:pointer}
.days button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.bingo{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.bingo button{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:10px;padding:6px;cursor:pointer;line-height:1.25;overflow:hidden}
.bingo button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .tabs{display:grid;grid-template-columns:repeat(5,1fr);max-width:480px;margin:0 auto}
nav button{background:transparent;border:none;cursor:pointer;padding:8px 2px 9px;color:var(--muted);font-family:var(--font-body);font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:16px;line-height:1}
nav button[aria-pressed="true"]{color:var(--accent)}
.cookie{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:14px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cookie .in{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
/* dark overlays */
.panel{position:fixed;inset:0;background:var(--panel);color:var(--panel-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:30;text-align:center;overflow-y:auto;
  padding:max(22px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.panel h2,.panel h3{color:var(--panel-ink)}
.panel .sub{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--panel-muted)}
.panel .muted{color:var(--panel-muted);font-size:13px;max-width:34ch;text-wrap:balance}
.panel input,.panel textarea{background:var(--panel-2);border:1px solid var(--panel-line);color:var(--panel-ink)}
.panel input.code{font-family:var(--font-mono);letter-spacing:.14em;text-align:center}
.tools{display:flex;flex-direction:column;gap:9px;width:100%;max-width:330px}
.flat{font-family:var(--font-body);font-size:14px;padding:12px;border-radius:11px;border:1px solid var(--panel-line);background:transparent;color:var(--panel-muted);cursor:pointer;width:100%}
.flat.go{border-color:var(--teal);color:var(--teal)}
.flat.danger{border-color:var(--flame);color:var(--flame)}
.flat:disabled{opacity:.4;cursor:default}
.flat .hint{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--panel-muted);margin-top:4px}
.dial{position:relative;width:min(62vw,218px);aspect-ratio:1;flex:none;max-width:100%}
.dial svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
.dial .track{fill:none;stroke:#1E2731;stroke-width:5}
.dial .prog{fill:none;stroke:var(--teal);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset .3s linear}
.dial .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transform:none}
.clock{font-family:var(--font-mono);font-weight:300;font-size:clamp(38px,12vw,52px);font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.intent{font-family:var(--font-display);font-size:19px;max-width:22ch;overflow-wrap:anywhere}
.slips{font-size:12px;color:var(--panel-muted);min-height:1.2em;max-width:32ch;text-wrap:balance}
.slips.bad{color:var(--flame)}
.hold{position:relative;overflow:hidden}
.hold .fill{position:absolute;inset:0 auto 0 0;width:0;background:var(--panel-line);pointer-events:none}
.hold .txt{position:relative}
.mon{display:block;margin:0 auto;max-width:100%;height:auto}
#nick-monsters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
#nick-monsters .flat{padding:10px 6px}
#nick-monsters .mon{width:100%;max-width:72px}
.fune{font-family:var(--font-display);font-size:25px;max-width:18ch;text-wrap:balance;min-height:3em;display:flex;align-items:center;justify-content:center}
.jail{position:relative;width:120px;height:186px;border:2px solid var(--panel-line);border-radius:12px;background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-size:34px}
.jail::after{content:"";position:absolute;inset:0;border-radius:10px;background:repeating-linear-gradient(90deg,transparent 0 15px,var(--panel-line) 15px 19px)}
.sr{display:flex;flex-direction:column;gap:0;width:100%;max-width:330px;text-align:left}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:7px 0;border-top:1px solid var(--panel-line)}
.kv:first-child{border-top:none}
.kv b{font-family:var(--font-mono);font-weight:400;color:var(--panel-ink)}
.kv span{color:var(--panel-muted);min-width:0}
.wheel-wrap{position:relative;width:min(70vw,240px);aspect-ratio:1}
.wheel{width:100%;height:100%;border-radius:50%;border:3px solid var(--panel-line);transition:transform 3.4s cubic-bezier(.17,.67,.21,1)}
.needle{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:20px;z-index:2}
.world{width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.world svg{display:block;width:100%;height:auto}
/* blackout: the page goes dead black, only the clock and the hold button survive */
.panel.blk{background:#000;gap:26px}
.panel.blk .dial{width:min(46vw,160px)}
.panel.blk .dial .track{stroke:#090909}
.panel.blk .dial .prog{stroke:#17323A}
.panel.blk .clock{color:#1B2A31;font-size:clamp(30px,9vw,38px)}
.panel.blk .sub,.panel.blk .intent,.panel.blk .slips,.panel.blk #jail-line,.panel.blk #s-pet{display:none}
.panel.blk .flat{border-color:#141414;color:#2A3A42}
.panel.blk #gate,.panel.blk #parkbox{color:#7D8E99}
.panel.blk #gate .flat,.panel.blk #parkbox .flat{border-color:#243039;color:#7D8E99}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<!-- 1. language -->
<div class="panel" id="choose" hidden>
  <svg class="logo" style="width:60px;height:60px" viewBox="0 0 64 64" role="img" aria-label="GrowthLock">
    <path d="M20 32 V23 a12 12 0 0 1 24 0 V32" fill="none" stroke="#3FB8C4" stroke-width="7" stroke-linecap="round"></path>
    <rect x="12" y="29" width="40" height="26" rx="7" fill="#12343A" stroke="#3FB8C4" stroke-width="5"></rect>
    <rect x="20.75" y="42" width="5.5" height="7" rx="1.5" fill="#3FB8C4"></rect>
    <rect x="29.25" y="38" width="5.5" height="11" rx="1.5" fill="#3FB8C4"></rect>

<!-- 2. nickname + companion -->
<div class="panel" id="nick" hidden>
  <p class="sub" id="nick-sub"></p>
  <h2 id="nick-title"></h2>
  <div class="tools">
    <input type="text" id="nick-input" maxlength="18" autocomplete="off">
    <p class="muted" id="nick-pickline"></p>
    <div class="row" id="nick-monsters" style="gap:8px"></div>
    <button class="flat go" id="nick-go"></button>
  </div>
</div>

<div class="app" id="app" hidden>
  <header><div class="wrap hrow">
    <div class="mark-wrap">
      <svg class="logo" viewBox="0 0 64 64" aria-hidden="true">
        <path class="shackle" d="M20 32 V23 a12 12 0 0 1 24 0 V32"></path>
        <rect class="body" x="12" y="29" width="40" height="26" rx="7"></rect>
        <rect class="bar" x="20.75" y="42" width="5.5" height="7" rx="1.5"></rect>
        <rect class="bar" x="29.25" y="38" width="5.5" height="11" rx="1.5"></rect>
        <rect class="bar" x="37.75" y="34" width="5.5" height="15" rx="1.5"></rect>
      </svg>
      <h1>GrowthLock</h1>
    </div>
    <div class="hbtns">
      <span class="lvl" id="lvl-pill">Lv 1</span>
      <button class="iconbtn" id="help-btn" aria-label="help">?</button>
      <button class="iconbtn" id="lang-btn">EN</button>
    </div>
  </div></header>

  <main class="wrap">
    <!-- FOCUS -->
    <section id="v-focus">
      <div id="banners" style="display:flex;flex-direction:column;gap:8px"></div>
      <div><h2 id="hello"></h2></div>
      <a class="btn" id="get-apk" href="growthlock.apk" download style="display:none;text-decoration:none;text-align:center"></a>
      <p class="small" id="apk-note" style="display:none;margin-top:-8px"></p>
      <div class="card">
        <div>
          <span class="label" data-t="howlong"></span>
          <div class="chips" id="chips">
            <button class="chip" data-min="15" aria-pressed="false">15<small data-t="min"></small></button>
            <button class="chip" data-min="25" aria-pressed="true">25<small data-t="min"></small></button>
            <button class="chip" data-min="45" aria-pressed="false">45<small data-t="min"></small></button>
            <button class="chip" data-min="90" aria-pressed="false">90<small data-t="min"></small></button>
            <button class="chip" data-min="180" aria-pressed="false">180<small data-t="min"></small></button>
          </div>
        </div>
        <div>
          <span class="label" data-t="doing"></span>
          <input type="text" id="intent-input" data-tp="doingph" maxlength="70" autocomplete="off">
        </div>
      </div>
      <button class="btn" id="start" data-t="start"></button>

      <details class="card" id="opts">
        <summary style="cursor:pointer;font-size:14px;font-weight:600;list-style:none" data-t="options"></summary>
        <div class="row">
          <input type="text" id="custom-min" inputmode="numeric" maxlength="4" data-tp="customph">
          <button class="btn sm ghost" id="custom-go" data-t="usecustom"></button>
        </div>
        <div>
          <span class="label" data-t="category"></span>
          <div class="seg" id="cat-seg">
            <button data-c="work" aria-pressed="true" data-t="cWork"></button>
            <button data-c="study" aria-pressed="false" data-t="cStudy"></button>
            <button data-c="move" aria-pressed="false" data-t="cMove"></button>

  f.forEach(function(fr,i){var o=ac.createOscillator(),g=ac.createGain(),d=i*0.17;o.type=ty||"sine";o.frequency.value=fr;
  g.gain.setValueAtTime(0.0001,ac.currentTime+d);g.gain.exponentialRampToValueAtTime(0.2,ac.currentTime+d+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d+1);o.connect(g);g.connect(ac.destination);
  o.start(ac.currentTime+d);o.stop(ac.currentTime+d+1.1)})}catch(e){}}

var amb={ctx:null,nodes:[],on:false};
function ambStop(){try{amb.nodes.forEach(function(n){try{n.stop?n.stop():n.disconnect()}catch(e){}});}catch(e){}amb.nodes=[];amb.on=false}
function ambStart(kind,vol){
  ambStop();if(!kind||kind==="none")return;
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state==="suspended")ac.resume();
    var len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+0.02*w)/1.02;d[i]=last*3.5}
    var src=ac.createBufferSource();src.buffer=buf;src.loop=true;
    var flt=ac.createBiquadFilter(),g=ac.createGain();
    flt.type="lowpass";
    flt.frequency.value=kind==="rain"?2200:kind==="waves"?700:kind==="fire"?1400:400;
    g.gain.value=(vol/100)*(kind==="hum"?0.5:0.35);
    src.connect(flt);flt.connect(g);g.connect(ac.destination);src.start();
    amb.nodes=[src];amb.on=true;amb.gain=g;
    if(kind==="waves"){
      var lfo=ac.createOscillator(),lg=ac.createGain();
      lfo.frequency.value=0.12;lg.gain.value=(vol/100)*0.22;
      lfo.connect(lg);lg.connect(g.gain);lfo.start();amb.nodes.push(lfo);
    }
  }catch(e){}
}

  var p=P();if(p){p.settings.vol=+$("amb-vol").value;save()}

    d.innerHTML='<div class="em">'+(owned?"🪐":"·")+'</div><div class="nm">'+(owned?pl[li]:"???")+'</div>';
    pg.appendChild(d)});
}
function renderStats(){
  var p=P(),now=Date.now(),week=0,month=0,total=0;
  p.sessions.forEach(function(s){total+=s.focused;
    if(now-s.ts<7*86400000)week+=s.focused;if(now-s.ts<30*86400000)month+=s.focused});
  $("r-week").textContent=week;$("r-month").textContent=month;$("r-total").textContent=Math.round(total/60);
  var cp=p.sessions.length?Math.round(100*p.sessions.filter(function(s){return s.clean}).length/p.sessions.length):0;
  var score=Math.min(100,Math.round(cleanStreak()*6+cp*0.4+Math.min(40,week/10)));
  $("life-bar").style.width=score+"%";$("life-line").textContent=score+" / 100";
  $("life-break").textContent=fmt("lifeBreak",{a:cleanStreak(),b:cp,c:week});
  /* skill paths */
  var pk=["work","study","move","sleep"],pn={work:"cWork",study:"cStudy",move:"cMove",sleep:"cSleep"};
  var pmax=Math.max(1,Math.max.apply(null,pk.map(function(k){return p.paths[k]||0})));
  var pb=$("paths-box");pb.innerHTML="";
  pk.forEach(function(k){
    var v=p.paths[k]||0,row=document.createElement("div");
    row.innerHTML='<div class="small" style="display:flex;justify-content:space-between"><span>'+t(pn[k])+
      '</span><span>Lv '+levelInfo(v*2).level+' · '+v+"′</span></div>"+
      '<div class="bar" style="margin-top:4px"><i style="width:'+Math.round(100*v/pmax)+'%"></i></div>';
    pb.appendChild(row)});
  /* weekly target with rest days */
  var wkT=p.settings.wk||5,since=Date.now()-7*86400000;
  var wkDone=p.sessions.filter(function(s){return s.ts>=since&&s.completed}).length;
  $("wk-target").value=wkT;
  $("wk-bar").style.width=Math.min(100,Math.round(100*wkDone/wkT))+"%";
  $("wk-line").textContent=fmt("weekProg",{a:wkDone,b:wkT})+((p.rest&&p.rest[dayKey(Date.now())])?" · "+t("restday"):"");
  $("life-total").textContent=fmt("lifetime",{n:p.sessions.length,m:totalMin()});
  /* recap card */
  $("recap-card").innerHTML='<div style="border:1px solid var(--line);border-radius:14px;padding:16px;background:linear-gradient(145deg,var(--accent-soft),var(--surface));display:flex;flex-direction:column;gap:8px">'+
    '<div style="display:flex;justify-content:space-between;align-items:center"><b style="font-family:var(--font-display);font-size:19px;font-weight:400">GrowthLock</b><span class="small">'+weekKey()+'</span></div>'+
    '<div style="display:flex;gap:14px;flex-wrap:wrap"><div><div style="font-family:var(--font-mono);font-size:24px">'+week+'</div><div class="small">'+t("thisweek")+'</div></div>'+
    '<div><div style="font-family:var(--font-mono);font-size:24px">'+wkDone+'</div><div class="small">'+t("blocks")+'</div></div>'+
    '<div><div style="font-family:var(--font-mono);font-size:24px">'+cleanStreak()+'</div><div class="small">'+t("streak")+'</div></div>'+
    '<div><div style="font-family:var(--font-mono);font-size:24px">'+(p.world.trees+p.world.stars+p.world.books)+'</div><div class="small">'+t("worldTitle")+'</div></div></div>'+
    '<div style="display:flex;align-items:center;gap:10px">'+monster(p.mon,44,0,p.settings.outfit)+'<span class="small">'+(p.nick||root.active)+'</span></div></div>';
  var byDay={};p.sessions.forEach(function(s){var k=dayKey(s.ts);byDay[k]=(byDay[k]||0)+s.focused});
  var hm=$("heat");hm.innerHTML="";
  for(var i=29;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);
    var v=byDay[dayKey(d.getTime())]||0,el=document.createElement("i");
    var a=v===0?0:v<25?30:v<60?55:v<120?80:100;
    if(a)el.style.background="color-mix(in srgb, var(--accent) "+a+"%, var(--line))";
    el.title=dayKey(d.getTime())+": "+v;hm.appendChild(el)}
  var hrs=new Array(24).fill(0);
  p.sessions.forEach(function(s){hrs[new Date(s.ts).getHours()]+=s.focused});
  var mx=Math.max.apply(null,hrs)||0,hd=$("hours");hd.innerHTML="";
  hrs.forEach(function(v){var el=document.createElement("i");el.style.height=(mx?Math.round(100*v/mx):2)+"%";
    if(mx&&v===mx)el.className="on";hd.appendChild(el)});
  $("best-hour").textContent=mx>0?fmt("bestHour",{h:two(hrs.indexOf(mx))}):t("nodata");
  var done=p.moods.filter(function(m){return m.a});
  if(done.length){var ab=0,aa=0;done.forEach(function(m){ab+=m.b;aa+=m.a});
    $("mood-summary").textContent=fmt("moodLine",{a:(ab/done.length).toFixed(1),b:(aa/done.length).toFixed(1),n:done.length})}
  else $("mood-summary").textContent=t("moodNone");
  var tips=[],ul=$("coach-list");ul.innerHTML="";
  if(!p.sessions.length)tips.push(li===0?"Ξεκίνα με 15 λεπτά. Μικρό και σίγουρο.":"Start with 15 minutes. Small and certain.");
  if(cp<60&&p.sessions.length>2)tips.push(li===0?"Τα μισά μπλοκ σπάνε. Βάλε το κινητό σε άλλο δωμάτιο.":"Half your blocks break. Put the phone in another room.");
  if(week<60)tips.push(li===0?"Λιγότερο από μία ώρα αυτή την εβδομάδα. Στόχος: τρία μπλοκ.":"Under an hour this week. Target: three blocks.");
  if(mx>0)tips.push((li===0?"Είσαι πιο κοφτερός στις ":"You are sharpest at ")+two(hrs.indexOf(mx))+":00.");
  if(cleanStreak()>=3)tips.push((li===0?"Σερί ":"Run of ")+cleanStreak()+(li===0?". Μην το σπάσεις σήμερα.":". Don't break it today."));
  tips.slice(0,4).forEach(function(x){var l=document.createElement("li");var s=document.createElement("span");s.className="v";s.textContent=x;l.appendChild(s);ul.appendChild(l)});
  $("report-text").textContent=li===0
    ?"GrowthLock — "+root.active+"\nΕβδομάδα: "+week+"′\nΜήνας: "+month+"′\nΣύνολο: "+Math.round(total/60)+" ώρες\nΜπλοκ: "+finishedCount()+" · Καθαρά: "+cp+"%\nΣερί: "+cleanStreak()+"\nLife score: "+score+"/100\n(Μετρημένα μόνο τα μπλοκ της εφαρμογής.)"
    :"GrowthLock — "+root.active+"\nWeek: "+week+" min\nMonth: "+month+" min\nTotal: "+Math.round(total/60)+" hours\nBlocks: "+finishedCount()+" · Clean: "+cp+"%\nRun: "+cleanStreak()+"\nLife score: "+score+"/100\n(Measured from this app's blocks only.)";
  var lg=$("log");lg.innerHTML="";
  p.sessions.slice(-8).reverse().forEach(function(s){
    var l=document.createElement("li");
    var a=document.createElement("span");a.className="k";a.textContent=s.focused+"′";
    var b=document.createElement("span");b.className="v";b.textContent=s.intention||t("focus");
    var c=document.createElement("span");c.className="m "+(s.clean?"ok":"bad");
    c.textContent=s.clean?t("markclean"):(s.completed?String(s.slips):t("pillcut"));
    l.appendChild(a);l.appendChild(b);l.appendChild(c);lg.appendChild(l)});
}
function renderMore(){
  var p=P(),g=$("ach-grid");g.innerHTML="";
  ACH.forEach(function(a){var has=!!p.ach[a.id];var d=document.createElement("div");
    d.className="tile"+(has?"":" locked");
    d.innerHTML='<div class="em">'+a.e+'</div><div class="nm">'+a.n[li]+'</div>';g.appendChild(d)});
  var ul=$("museum-list");ul.innerHTML="";
  p.fails.slice(-8).reverse().forEach(function(f){var l=document.createElement("li");
    var a=document.createElement("span");a.className="k";a.textContent=f.minutes+"/"+f.of+"′";
    var b=document.createElement("span");b.className="v";b.textContent=f.excuse;
    l.appendChild(a);l.appendChild(b);ul.appendChild(l)});
  var fin=finishedCount();
  $("secret-line").textContent=fin>=10?t("unlocked"):fmt("locked10",{n:fin});
  $("secret-body").hidden=fin<10;
  var pl=$("profile-list");pl.innerHTML="";
  Object.keys(root.profiles).forEach(function(nm){
    var l=document.createElement("li");
    var b=document.createElement("button");b.className="iconbtn";b.textContent=nm===root.active?"●":"○";
    b.addEventListener("click",function(){root.active=nm;save();applySkin();applyLang()});
    var s=document.createElement("span");s.className="v";s.textContent=nm;
    var m=document.createElement("span");m.className="m ok";m.textContent="Lv "+levelInfo(root.profiles[nm].xp||0).level;
    l.appendChild(b);l.appendChild(s);l.appendChild(m);pl.appendChild(l)});
  $("set-bed").value=p.settings.bed;$("set-morn").value=p.settings.morn;
  $("set-break").value=p.settings.brk;$("set-emg").value=p.settings.emg;
  $("set-sound").value=p.settings.sound;$("set-quiet").checked=!!p.settings.quiet;
  $("set-tag").value=p.settings.tag||"";$("amb-sel").value=p.settings.amb||"none";$("amb-vol").value=p.settings.vol||45;
  var hl=$("honest-list");hl.innerHTML="";
  HONEST.forEach(function(h){var l=document.createElement("li");var s=document.createElement("span");
    s.className="v";s.textContent=h[li];l.appendChild(s);hl.appendChild(l)});
  renderSched();renderDayPicker();applySkin();renderOS();
}
function renderBanners(){
  var p=P(),now=new Date(),mins=now.getHours()*60+now.getMinutes();
  $("banners").innerHTML="";
  var bd=(p.settings.bed||"23:30").split(":"),bm=(+bd[0])*60+(+bd[1]),diff=bm-mins;
  if(diff>0&&diff<=60)banner(fmt("bedSoon",{n:diff}));
  if(mins>=bm||mins<5*60)banner(t("nightCh"));
  var mo=(p.settings.morn||"07:30").split(":"),mm=(+mo[0])*60+(+mo[1]);
  if(mins>=mm&&mins<mm+90)banner(t("morningCh"));
  checkSched();
}
function renderAll(){
  if(!P())return;
  renderToday();renderQuests();renderTasks();renderParked();renderWorld();renderBingo();renderShop();
  renderPets();renderStats();renderMore();renderBanners();
}

/* ---------- boot ---------- */
if(root.lang==="el"||root.lang==="en")li=root.lang==="en"?1:0;
if(!root.lang){$("choose").hidden=false}
else if(!root.active||!root.profiles[root.active]){startNick()}
else{$("app").hidden=false;applySkin();if(!root.cookie)$("cookie").hidden=false}
applyLang();
})();
</script>
