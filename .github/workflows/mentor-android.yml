name: Build Mentor APK

# Runs on a push that touches the mentor, and on demand from the Actions tab.
# The page itself lives at mentor/index.html and is also served on the website;
# this workflow wraps that exact file in an APK so it works on the phone with
# no network at all.
on:
  push:
    branches: [main]
    paths:
      - "mentor/**"
      - "mentor-app/**"
      - "site/fonts.css"
      - "site/fonts/**"
      - ".github/workflows/mentor-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the built mentor.apk back to the site
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Nothing is bundled any more. The mentor is a private Claude artifact
      # with real AI in it, so it cannot ship inside an APK; this app is a
      # launcher icon plus the daily local alarms, and it opens the page in
      # the phone's own browser, where the Claude session already lives.
      - name: Build the APK
        working-directory: mentor-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Mentor-apk
          path: mentor-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # An Actions artifact can only be downloaded by someone signed in to
      # GitHub, which is useless on a phone. Committing the APK to the site
      # root puts it one tap away at evzomethod.com/mentor.apk instead. The
      # push triggers nothing: this workflow only watches mentor/, mentor-app/
      # and site/fonts, so a commit of the apk cannot loop back into a build.
      - name: Publish the APK on the site
        run: |
          cp mentor-app/android/app/build/outputs/apk/release/app-release.apk mentor.apk
          # The installed app reads this on launch: the page updates itself, but
          # a change to the Kotlin around it needs a new APK, and this is how it
          # finds out. versionCode is the run number, so the comparison is direct.
          printf '{"build":%s,"apk":"/mentor.apk"}\n' "${{ github.run_number }}" > mentor-version.json
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mentor.apk mentor-version.json
          if git diff --cached --quiet; then
            echo "identical build, nothing to publish"
          else
            git commit -m "Mentor: publish build ${{ github.run_number }} at /mentor.apk"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
