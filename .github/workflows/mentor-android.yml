name: Build Mentor APK

# Runs on a push that touches the mentor, and on demand from the Actions tab.
# The page itself lives at mentor/index.html and is also served on the website;
# this workflow wraps that exact file in an APK so it works on the phone with
# no network at all.
on:
  push:
    branches: [main]
    paths:
      - "mentor/**"
      - "mentor-app/**"
      - "site/fonts.css"
      - "site/fonts/**"
      - ".github/workflows/mentor-android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the built mentor.apk back to the site
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The page is copied in at its own path, mentor/, because its markup asks
      # for ../site/fonts.css - so the fonts have to sit beside it in the same
      # shape they have on the website, or the Greek text falls back to a
      # system font and the layout shifts.
      # The lock screen AND the ciphertext go in, never the plaintext page.
      # That is what makes a public mentor.apk harmless: pull it apart and all
      # you find is app.enc. The passphrase is typed once on the phone and the
      # derived key is cached in the WebView, so it opens straight after.
      - name: Bundle the sealed page and its fonts into the APK
        run: |
          A=mentor-app/android/app/src/main/assets
          mkdir -p "$A/mentor" "$A/site/fonts" "$A/brand"
          cp mentor/index.html "$A/mentor/index.html"
          cp mentor/app.enc   "$A/mentor/app.enc"
          cp site/fonts.css "$A/site/fonts.css"
          cp -r site/fonts/. "$A/site/fonts/"
          cp brand/evzo-profile-navy-zowhite.png "$A/brand/" || true
          if grep -q "Offer Builder" "$A/mentor/index.html"; then
            echo "REFUSING: plaintext page reached the assets"; exit 1
          fi
          echo "bundled:"; find "$A" -type f | wc -l; du -sh "$A"

      - name: Build the APK
        working-directory: mentor-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: Mentor-apk
          path: mentor-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # An Actions artifact can only be downloaded by someone signed in to
      # GitHub, which is useless on a phone. Committing the APK to the site
      # root puts it one tap away at evzomethod.com/mentor.apk instead. The
      # push triggers nothing: this workflow only watches mentor/, mentor-app/
      # and site/fonts, so a commit of the apk cannot loop back into a build.
      - name: Publish the APK on the site
        run: |
          cp mentor-app/android/app/build/outputs/apk/release/app-release.apk mentor.apk
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add mentor.apk
          if git diff --cached --quiet; then
            echo "identical build, nothing to publish"
          else
            git commit -m "Mentor: publish build ${{ github.run_number }} at /mentor.apk"
            git pull --rebase --autostash origin main
            git push origin HEAD:main
          fi
