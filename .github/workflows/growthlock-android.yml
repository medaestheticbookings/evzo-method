name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Android's own debug keystore, with the documented public defaults that
      # every Android SDK uses. It is committed once so that every build is
      # signed the same way: without that, each run would sign differently and
      # Android would refuse to install a new version over the old one, which
      # would mean losing the player's progress on every update.
      - name: Keep one signing key
        working-directory: growthlock-app/android
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug, O=Android, C=US"
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add debug.keystore
            git commit -m "GrowthLock: one signing key, so updates keep the player's progress"
            git push
          fi

      - name: Bundle the app page into the APK
        run: |
          mkdir -p growthlock-app/android/app/src/main/assets
          cp renew/index.html growthlock-app/android/app/src/main/assets/index.html

      - name: Build the APK
        working-directory: growthlock-app/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: GrowthLock-apk
          path: growthlock-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
