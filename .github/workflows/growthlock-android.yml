name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bundle the app page into the APK
        run: |
          mkdir -p growthlock-app/android/app/src/main/assets
          cp growthlock/index.html growthlock-app/android/app/src/main/assets/index.html

      - name: Build the debug APK
        working-directory: growthlock-app/android
        run: gradle assembleDebug --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: GrowthLock-apk
          path: growthlock-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
